ckeditor:
  edition: standard
  enabled: true
  schemaVersion: 5.6.0.0
conventions:
  edition: standard
  enabled: true
  schemaVersion: 1.0.0
formie:
  edition: standard
  enabled: true
  schemaVersion: 4.0.89
  settings:
    ajaxTimeout: 10
    alertEmails: null
    alertEmailsUserGroup: null
    allowHiddenFieldTemplates: true
    allowHtmlFieldTemplateIncludes: true
    allowHtmlFieldTwig: true
    allowLegacySignatureImageUrls: true
    allowMultiSelectDropdowns: true
    allowPhoneCountrySelector: true
    allowPublicVolumes: true
    allowedSubmitMethods: both
    anonymousFormBootstrapRateLimit: 30
    anonymousFormRateWindowSeconds: 60
    anonymousFormRefreshRateLimit: 120
    compatibilityMode: true
    completionQueryAllowlist:
      - utm_source
      - utm_medium
      - utm_campaign
      - utm_term
      - utm_content
    defaultCpSubmissionFieldConditions: follow
    defaultEmailTemplate: ''
    defaultErrorMessagePosition: verbb\formie\positions\BelowInput
    defaultExportFolder: '@storage/formie-export'
    defaultFormStencil: ''
    defaultFormTemplate: ''
    defaultInstructionsPosition: verbb\formie\positions\AboveInput
    defaultLabelPosition: verbb\formie\positions\AboveInput
    defaultPage: forms
    deliveryEvidenceRetentionDays: 30
    emptyValuePlaceholder: 'No response.'
    enableBackSubmission: true
    enableCsrfValidationForGuests: true
    enableLargeFieldStorage: false
    enableMultiPageForms: true
    enableUnloadWarning: true
    encryptionKey: null
    errorAriaLive: polite
    filterIntegrationMapping: true
    includeDraftElementUsage: false
    includeFlatpickrCss: true
    includeRevisionElementUsage: false
    integrationAlertEmails: null
    integrationAlertEmailsUserGroup: null
    integrationApiErrorHandling:
      -
        __assoc__:
          -
            - severity
            - rate_limited
          -
            - action
            - logWarning
      -
        __assoc__:
          -
            - severity
            - rejected
          -
            - action
            - logWarning
      -
        __assoc__:
          -
            - severity
            - failure
          -
            - action
            - failQueue
    maxEmailAttachmentSizeMb: 15
    maxIncompleteSubmissionAge: 30
    maxSentNotificationsAge: 30
    maxStagedUploadBytes: 67108864
    maxStagedUploadFiles: 50
    outputConsoleMessages: true
    paymentWebhookProxyUrl: null
    pdfPaperOrientation: portrait
    pdfPaperSize: letter
    plainTextHtmlSanitizationMode: preserve
    pluginName: Formie
    queuePriority: null
    redirectUri: null
    reportAsyncExportRowThreshold: 1000
    reportExportSingleUseDownload: true
    reportInteractiveExportExpiryHours: 72
    reportScheduledExportExpiryHours: 48
    reportTablePageSize: 100
    requireHtmlPurification: false
    saveResumeTokenTtlDays: 14
    sendEmailAlerts: false
    sendIntegrationAlerts: false
    sentNotifications: true
    setOnlyCurrentPagePayload: false
    staticCacheRefreshOnLoad: false
    submissionSidebarFormOrder: dateCreatedDesc
    submissionStateRetentionDays: 30
    submissionsBehaviour: all
    useCssLayers: false
    useQueueForIntegrations: true
    useQueueForNotifications: true
    validateCustomTemplates: true
navigation:
  edition: standard
  enabled: true
  schemaVersion: 4.0.10
phonehome:
  edition: standard
  enabled: true
  schemaVersion: 1.0.0
seomatic:
  edition: standard
  enabled: true
  schemaVersion: 3.0.13
toolbelt:
  edition: standard
  enabled: true
  schemaVersion: 1.0.0
vite:
  edition: standard
  enabled: true
  schemaVersion: 1.0.0
