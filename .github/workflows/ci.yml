name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_php:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        php: [8.4]

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v4

      - name: 🐘 Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        working-directory: src
        run: composer validate --strict --no-check-lock --no-check-publish

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: 👨‍💻 Install Composer Dependencies
        run: composer install --working-dir=./src --prefer-dist --no-progress

      - name: 🛠 Run PHPStan
        run: src/vendor/bin/phpstan analyse -c ./phpstan.neon --memory-limit=1G

      - name: 🔬 Check ECS
        run: src/vendor/bin/ecs check --ansi --fix --config ./ecs.php

      - name: Execute tests (Unit and Feature tests) via PestPHP
        working-directory: src
        run: vendor/bin/pest

  build_node:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Set Up Node Environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          check-latest: true

      - name: 🧑‍💻 Install JS Dependencies
        run: npm ci

      - name: 📋 Run ESlint
        run: npm run eslint --if-present

      - name: 🧪 Run JS Tests
        run: npm run test --if-present

      - name: 👷‍ Build Front End Assets
        run: npm run build --if-present
